version: 2
task: text2music
seed: 42
repetitions: 1
plugins: []
dataset:
  name: manifest
  path: ../data/inputs.json
  num_samples: 10
# Explicit inputs: lyrics=true requires lyrics only for has_vocal=true records; instrumentals are excluded.
inputs: {style_prompt: true, lyrics: true, reference_audio: false}
algorithms:
  - name: my_t2m
    task: text2music
    env: my_t2m_env
    cuda_visible_devices: '0'
    cwd: ../algorithms/my_t2m
    infer_script: infer.py
    parameter_schema:
      checkpoint: {flag: --checkpoint, type: path, label: 模型权重路径, default: ''}
      duration: {flag: --duration, type: float, minimum: 0.1, default: 30}
      sr: {flag: --sr, type: int, minimum: 8000, default: 48000}
    parameters: {checkpoint: '', duration: 30, sr: 48000}
    args: []
# my_t2m is a sine-wave template. Connect a real generator before scientific comparisons.
# Fixed task policy is filled from built-ins if metric_rules is omitted.
evaluation_environment: songeval  # Or musicbench; change this one shared environment name
metric_options:
  audiobox: {checkpoint: /data/musicbench-evaluators/audiobox-aesthetics/weights/checkpoint.pt, cuda_visible_devices: '0'}
  songeval:
    repo: ../third_party/SongEval
    muq_model: /data/musicbench-evaluators/MuQ/weights/muq
    cuda_visible_devices: '0'
    device: auto
    timeout: 3600
  lyrics:
    model: /data/musicbench-evaluators/faster-whisper/weights/large-v3
    language: zh
    device: auto
    cuda_visible_devices: '0'
    beam_size: 5
    audio_source: demucs
    separation: { device: auto, cuda_visible_devices: '0', model: htdemucs, repo: /data/musicbench-evaluators/demucs/weights}
  clap_score: {model: /data/musicbench-evaluators/CLAP/weights/clap, device: auto, cuda_visible_devices: '0'}
  mulan: {model: /data/musicbench-evaluators/MuQ/weights/mulan, audio_model: /data/musicbench-evaluators/MuQ/weights/muq, text_model: /data/musicbench-evaluators/MuQ/weights/xlm-roberta-base, device: auto, cuda_visible_devices: '0'}
  fad: {model: /data/musicbench-evaluators/CLAP/weights/clap, device: auto, cuda_visible_devices: '0'}
# When reference_audio is true:
# reference_audio: {source: directory, path: /data/real_music, num_samples: 100}
# Or use the sampled manifest's audio_path values: reference_audio: {source: dataset}
require_metrics: true
timeout: 7200
